project:
  type: book
  output-dir: _site
  resources:
    - assets/

number-sections: true

book:
  title: "Investment Appraisal"
  subtitle: "Introduction and Methods"
  author: "Prof. Dr. Christian Kraus"
  date: "last-modified"
  chapters:
    - index.qmd
    - part: "Part I — The Time-Value Toolkit"
      chapters:
        - 01_timevalue.qmd
        - 02_cashflows.qmd
        - 03_debt_valuation.qmd
    - part: "Part II — Core Appraisal Methods"
      chapters:
        - 04_npv.qmd
        - 05_irr.qmd
        - 06_annuity.qmd
    - part: "Part III — Real-World Complications"
      chapters:
        - 07_taxes.qmd
        - 08_dean.qmd
        - 09_risk.qmd
    - part: "Part IV — Investing Responsibly"
      chapters:
        - 10_ethics.qmd

  appendices:
    - tutorials.qmd

  # Navigation & Suche
  sidebar:
    style: "docked"
    background: light # Passt gut zu deinem thws-grey/orange
    collapse-level: 1
    search: true
  repo-url: https://github.com/c-kraus/BUA3
  repo-actions: [issue]
  
format:
  moodle-html:
    toc-depth: 2

# Globale Optionen für Code-Zellen (Tech-Stack)
execute:
  echo: false
  warning: false

lang: en
