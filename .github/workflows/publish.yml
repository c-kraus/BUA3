name: Quarto Publish HTML

on:
  push:
    branches: main  # oder 'master', checke deinen Branch-Namen!
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        # Da wir keine PDFs bauen (das machst du ja lokal mit Typst), 
        # brauchen wir hier keine TinyTex Installation -> Spart Zeit.

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: moodle-html

      - name: Render tutorial PDFs (questions + solutions) into the site
        run: |
          set -e
          mkdir -p _site/tutorials
          for f in tutorials/tut_*.qmd; do
            base=$(basename "$f" .qmd)
            # questions-only sheet
            quarto render "$f" --to tutorial-typst -M show_solutions:false
            mv "tutorials/${base}.pdf" "tutorials/${base}_questions.pdf"
            # full solutions sheet
            quarto render "$f" --to tutorial-typst -M show_solutions:true
          done
          cp tutorials/*.pdf _site/tutorials/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Der Action-Runner findet den Output-Ordner (_site oder _book) 
          # meist automatisch. Falls nicht, müssen wir hier 'path' definieren.
          path: '_site' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4