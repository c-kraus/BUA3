<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Value of Money: Timeline</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: transparent;
            padding: 16px;
            color: #222;
        }
        .card {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-left: 5px solid #ff6a00;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.07);
            padding: 20px 24px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 3px;
        }
        .card-sub {
            font-size: 0.82rem;
            color: #777;
            margin-bottom: 18px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 18px;
        }
        .ctrl label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.78rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }
        .ctrl label .val {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ff6a00;
        }
        input[type=range] {
            width: 100%;
            accent-color: #ff6a00;
            cursor: pointer;
        }
        .timeline-wrap {
            background: #fafafa;
            border: 1px solid #ebebeb;
            border-radius: 6px;
            padding: 12px 8px 8px;
            margin-bottom: 14px;
            overflow: hidden;
        }
        svg#tl {
            display: block;
            width: 100%;
            overflow: visible;
        }
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .rbox {
            border-radius: 6px;
            padding: 12px 16px;
        }
        .rbox.pv { background: #edf5fc; border: 1px solid #b8d9f3; }
        .rbox.fv { background: #fff3e6; border: 1px solid #ffc580; }
        .rbox .rlabel {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #777;
            margin-bottom: 2px;
        }
        .rbox .rformula {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 4px;
            font-style: italic;
        }
        .rbox .ramount {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .rbox.pv .ramount { color: #1565c0; }
        .rbox.fv .ramount { color: #e65100; }
        @media (max-width: 500px) {
            .controls { grid-template-columns: 1fr; }
            .results  { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="card-title">The Time Machine: Compounding &amp; Discounting</div>
    <div class="card-sub">Adjust the sliders — watch how money moves forward and backward through time.</div>

    <div class="controls">
        <div class="ctrl">
            <label>Present Value (PV) <span class="val" id="pvDisp">€ 1,000</span></label>
            <input type="range" id="pvSl" min="500" max="10000" step="500" value="1000">
        </div>
        <div class="ctrl">
            <label>Interest Rate (i) <span class="val" id="iDisp">8 %</span></label>
            <input type="range" id="iSl" min="1" max="20" step="1" value="8">
        </div>
        <div class="ctrl">
            <label>Periods (n) <span class="val" id="nDisp">4</span></label>
            <input type="range" id="nSl" min="1" max="6" step="1" value="4">
        </div>
    </div>

    <div class="timeline-wrap">
        <svg id="tl" height="260"></svg>
    </div>

    <div class="results">
        <div class="rbox pv">
            <div class="rlabel">Present Value — t = 0</div>
            <div class="rformula" id="pvFml">PV = FV ÷ (1 + i)ⁿ</div>
            <div class="ramount" id="pvAmt">€ 1,000.00</div>
        </div>
        <div class="rbox fv">
            <div class="rlabel">Future Value — t = n</div>
            <div class="rformula" id="fvFml">FV = PV × (1 + i)ⁿ</div>
            <div class="ramount" id="fvAmt">€ 1,360.49</div>
        </div>
    </div>
</div>

<script>
(function () {
    var pvSl = document.getElementById('pvSl');
    var iSl  = document.getElementById('iSl');
    var nSl  = document.getElementById('nSl');
    var svg  = document.getElementById('tl');

    function fmtEur(v) {
        return '€ ' + v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function fmtShort(v) {
        if (v >= 1000000) return '€ ' + (v / 1000000).toFixed(2) + ' M';
        if (v >= 1000)    return '€ ' + Math.round(v).toLocaleString('de-DE');
        return '€ ' + v.toFixed(0);
    }

    function makeSVG(tag, attrs) {
        var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (var k in attrs) el.setAttribute(k, attrs[k]);
        return el;
    }
    function svgText(x, y, txt, attrs) {
        var el = makeSVG('text', Object.assign({ x: x, y: y, 'text-anchor': 'middle',
            'font-family': "'Inter', sans-serif", 'font-size': '11' }, attrs));
        el.textContent = txt;
        return el;
    }
    function svgLine(x1, y1, x2, y2, attrs) {
        return makeSVG('line', Object.assign({ x1: x1, y1: y1, x2: x2, y2: y2 }, attrs));
    }

    function draw() {
        var pv = parseFloat(pvSl.value);
        var i  = parseFloat(iSl.value) / 100;
        var n  = parseInt(nSl.value);
        var fv = pv * Math.pow(1 + i, n);

        document.getElementById('pvDisp').textContent = fmtEur(pv);
        document.getElementById('iDisp').textContent  = iSl.value + ' %';
        document.getElementById('nDisp').textContent  = n;
        document.getElementById('pvAmt').textContent  = fmtEur(pv);
        document.getElementById('fvAmt').textContent  = fmtEur(fv);
        document.getElementById('pvFml').textContent  =
            'PV = ' + fmtShort(fv) + ' ÷ (1 + ' + iSl.value + '%)^' + n;
        document.getElementById('fvFml').textContent  =
            'FV = ' + fmtShort(pv) + ' × (1 + ' + iSl.value + '%)^' + n;

        var W   = svg.getBoundingClientRect().width || 800;
        var H   = 260;
        svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
        svg.setAttribute('width', W);

        while (svg.firstChild) svg.removeChild(svg.firstChild);

        var ML = 58, MR = 58, axY = 148;
        var axW = W - ML - MR;
        var step = axW / n;

        // ── Defs ──────────────────────────────────────────────────────────
        var defs = makeSVG('defs', {});
        function mkArrow(id, color, dir) {
            var m = makeSVG('marker', { id: id, markerWidth: '9', markerHeight: '7',
                refX: dir === 'r' ? '7' : '2', refY: '3.5', orient: 'auto' });
            var p = makeSVG('path', { fill: color });
            p.setAttribute('d', dir === 'r' ? 'M0,0 L9,3.5 L0,7 Z' : 'M9,0 L0,3.5 L9,7 Z');
            m.appendChild(p);
            return m;
        }
        defs.appendChild(mkArrow('aR', '#e05e00', 'r'));
        defs.appendChild(mkArrow('aL', '#1565c0', 'l'));
        svg.appendChild(defs);

        // ── Axis ──────────────────────────────────────────────────────────
        svg.appendChild(svgLine(ML, axY, ML + axW, axY,
            { stroke: '#bbb', 'stroke-width': '2' }));

        // ── Compounding arrow ─────────────────────────────────────────────
        var compY = axY - 80;
        var compLine = svgLine(ML + 8, compY, ML + axW - 8, compY,
            { stroke: '#e05e00', 'stroke-width': '2.2', 'stroke-dasharray': '7 3',
              'marker-end': 'url(#aR)' });
        svg.appendChild(compLine);
        svg.appendChild(svgText((ML + ML + axW) / 2, compY - 9,
            'COMPOUNDING  →  FV = PV × (1+i)^n',
            { fill: '#e05e00', 'font-weight': '700', 'font-size': '11.5' }));

        // ── Discounting arrow ─────────────────────────────────────────────
        var discY = axY + 72;
        var discLine = svgLine(ML + axW - 8, discY, ML + 8, discY,
            { stroke: '#1565c0', 'stroke-width': '2.2', 'stroke-dasharray': '7 3',
              'marker-end': 'url(#aL)' });
        svg.appendChild(discLine);
        svg.appendChild(svgText((ML + ML + axW) / 2, discY + 17,
            '←  DISCOUNTING  –  PV = FV ÷ (1+i)^n',
            { fill: '#1565c0', 'font-weight': '700', 'font-size': '11.5' }));

        // ── Ticks, labels, bubbles ────────────────────────────────────────
        for (var t = 0; t <= n; t++) {
            var val = pv * Math.pow(1 + i, t);
            var x = ML + t * step;
            var isFirst = (t === 0), isLast = (t === n);

            // tick
            svg.appendChild(svgLine(x, axY - 7, x, axY + 7,
                { stroke: '#999', 'stroke-width': '1.5' }));

            // t-label
            svg.appendChild(svgText(x, axY + 22, 't = ' + t,
                { fill: '#666', 'font-size': '11' }));

            // value bubble
            var bY       = axY - 30;
            var fillC    = isFirst ? '#deeeff' : (isLast ? '#ffecd8' : '#f3f3f3');
            var strokeC  = isFirst ? '#1565c0' : (isLast ? '#e05e00' : '#ccc');
            var textC    = isFirst ? '#1565c0' : (isLast ? '#c43d00' : '#555');
            var valStr   = fmtShort(val);
            var bW       = Math.max(valStr.length * 7 + 14, 64);
            var bH       = 22;

            var rect = makeSVG('rect', {
                x: x - bW / 2, y: bY - bH, width: bW, height: bH,
                rx: '4', fill: fillC, stroke: strokeC, 'stroke-width': '1.5'
            });
            svg.appendChild(rect);
            svg.appendChild(svgText(x, bY - bH / 2 + 4, valStr,
                { fill: textC, 'font-weight': '700', 'font-size': '11' }));
        }

        // ── Step multiplier labels (×(1+i)) ──────────────────────────────
        var multLabel = '×(1+' + iSl.value + '%)';
        for (var s = 0; s < n; s++) {
            var cx = ML + s * step + step / 2;
            svg.appendChild(svgText(cx, axY - 13, multLabel,
                { fill: '#e05e00', 'font-size': '9.5', 'opacity': '0.85' }));
        }

        // postMessage for auto-resize
        var totalH = document.body.scrollHeight;
        window.parent.postMessage({ iframeHeight: totalH }, '*');
    }

    pvSl.addEventListener('input', draw);
    iSl.addEventListener('input', draw);
    nSl.addEventListener('input', draw);

    window.addEventListener('resize', function () { setTimeout(draw, 50); });
    draw();
})();
</script>
</body>
</html>
